<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<meta
    name="viewport"

>

<meta name="theme-color" content="#111111">

<meta
    name="apple-mobile-web-app-capable"

>

<meta

<title>YD ESP32</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    padding-bottom: 40px;

    background: #111;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.container {
    width: 100%;
    max-width: 500px;
    margin: auto;
}

h1 {
    margin: 5px 0 20px;
    font-size: 28px;
}

h2 {
    margin: 0;
    font-size: 18px;
}

.card {
    background: #1c1c1e;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
}

.header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    font-size: 14px;
    color: #aaa;
}

.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #666;
}

.status-dot.connected {
    background: #30d158;
}

button {
    border: none;
    border-radius: 12px;

    padding: 12px 18px;

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;

    background: #2c2c2e;
    color: white;
}

button:active {
    opacity: 0.7;
}

button.disconnect {
    background: #ff453a;
}

.error {
    color: #ff453a;
    font-size: 13px;
    margin-top: 10px;
    word-break: break-word;
}

.success {
    color: #30d158;
}

.muted {
    color: #888;
}


/* ================================================================ */
/* BATTERY                                                          */
/* ================================================================ */

.battery {
    text-align: center;
}

.soc-circle {

    width: 150px;
    height: 150px;

    border-radius: 50%;

    margin: 15px auto;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle,
            #1c1c1e 58%,
            transparent 59%
        ),
        conic-gradient(
            #30d158 0%,
            #333 0%
        );
}

.soc-value {
    font-size: 34px;
    font-weight: 700;
}

.soc-label {
    font-size: 13px;
    color: #aaa;
}

.values {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-top: 15px;
}

.value-box {

    background: #2c2c2e;

    border-radius: 12px;

    padding: 12px 5px;

    text-align: center;
}

.value {
    font-size: 17px;
    font-weight: 600;
}

.label {
    font-size: 12px;
    color: #999;
    margin-top: 4px;
}


/* ================================================================ */
/* CIRCUITS                                                         */
/* ================================================================ */

.circuit {

    margin-top: 12px;

    padding: 15px;

    background: #2c2c2e;

    border-radius: 14px;
}

.circuit:first-child {
    margin-top: 15px;
}

.circuit-header {

    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 10px;
}

.circuit-name {
    font-size: 17px;
    font-weight: 600;
}

.circuit-state {

    font-size: 13px;

    color: #999;

    font-weight: 600;
}

.circuit-state.on {
    color: #30d158;
}

.circuit-buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-top: 12px;
}

.on-button.active {

    background: #30d158;

    color: #000;
}

.off-button.active {

    background: #ff453a;

    color: white;
}


/* ================================================================ */
/* PACKET INFO                                                      */
/* ================================================================ */

.packet-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-top: 12px;
}

.packet-item {

    background: #2c2c2e;

    padding: 10px;

    border-radius: 10px;
}

.packet-title {

    font-size: 11px;

    color: #999;
}

.packet-value {

    margin-top: 3px;

    font-size: 15px;
}

</style>

</head>

<div class="container">

<h1>YD ESP32</h1>


<!-- ============================================================ -->
<!-- BLUETOOTH                                                     -->
<!-- ============================================================ -->

<div class="card">

    <div class="header-row">

        <div>

            <h2>Bluetooth</h2>

            <div class="status">

                <div
                    id="statusDot"
                    class="status-dot"
                ></div>

                <span id="connectionStatus">
                    Disconnected
                </span>

            </div>

        </div>


        <button
            id="connectButton"
            onclick="connectButtonPressed()"
        >
            Connect
        </button>

    </div>


    <div
        id="errorMessage"
        class="error"
    ></div>

</div>


<!-- ============================================================ -->
<!-- BATTERY                                                       -->
<!-- ============================================================ -->

<div class="card battery">

    <h2>Battery</h2>


    <div
        id="socCircle"
        class="soc-circle"
    >

        <div>

            <div
                id="socValue"
                class="soc-value"
            >
                --%
            </div>

            <div class="soc-label">
                SOC
            </div>

        </div>

    </div>


    <div class="values">

        <div class="value-box">

            <div
                id="batteryVoltage"
                class="value"
            >
                -- V
            </div>

            <div class="label">
                Voltage
            </div>

        </div>


        <div class="value-box">

            <div
                id="batteryCurrent"
                class="value"
            >
                -- A
            </div>

            <div class="label">
                Current
            </div>

        </div>


        <div class="value-box">

            <div
                id="batteryPower"
                class="value"
            >
                -- W
            </div>

            <div class="label">
                Power
            </div>

        </div>

    </div>

</div>


<!-- ============================================================ -->
<!-- CIRCUITS                                                       -->
<!-- ============================================================ -->

<div class="card">

    <h2>Circuits</h2>


    <!-- CIRCUIT 1 -->

    <div class="circuit">

        <div class="circuit-header">

            <div class="circuit-name">
                Circuit 1
            </div>

            <div
                id="state1"
                class="circuit-state"
            >
                OFF
            </div>

        </div>


        <div class="values">

            <div class="value-box">

                <div
                    id="c1Voltage"
                    class="value"
                >
                    -- V
                </div>

                <div class="label">
                    Voltage
                </div>

            </div>


            <div class="value-box">

                <div
                    id="c1Current"
                    class="value"
                >
                    -- A
                </div>

                <div class="label">
                    Current
                </div>

            </div>


            <div class="value-box">

                <div
                    id="c1Power"
                    class="value"
                >
                    -- W
                </div>

                <div class="label">
                    Power
                </div>

            </div>

        </div>


        <div class="circuit-buttons">

            <button
                id="c1On"
                class="on-button"
                onclick="setCircuit(1, true)"
            >
                ON
            </button>

            <button
                id="c1Off"
                class="off-button"
                onclick="setCircuit(1, false)"
            >
                OFF
            </button>

        </div>

    </div>


    <!-- CIRCUIT 2 -->

    <div class="circuit">

        <div class="circuit-header">

            <div class="circuit-name">
                Circuit 2

            <div

                <div
                    id="c2Voltage"
                    class="value"
                >
                    -- V
                </div>

                <div class="label">
                    Voltage
                </div>
