<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YD ESP32 Control</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            background: #111;
            color: #eee;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            margin-top: 0;
        }

        .card {
            background: #1d1d1d;

            border-radius: 14px;

            padding: 20px;

            margin-bottom: 16px;
        }

        button {
            width: 100%;

            border: none;
            border-radius: 10px;

            padding: 16px;

            font-size: 18px;
            font-weight: 600;

            margin-top: 10px;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #connectButton {
            background: #444;
            color: white;
        }

        #disconnectButton {
            background: #662222;
            color: white;
        }

        .circuit {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 14px;

            background: #292929;

            border-radius: 10px;

            margin-top: 10px;
        }

        .circuit-name {
            font-size: 18px;
            font-weight: 600;
        }

        .circuit-state {
            font-size: 14px;
            opacity: 0.7;
        }

        .circuit-button {
            width: 120px;

            margin: 0;

            padding: 10px;
        }

        .off {
            background: #444;
            color: white;
        }

        .red {
            background: #b32626;
            color: white;
        }

        .blue {
            background: #2458b8;
            color: white;
        }

        .green {
            background: #248a45;
            color: white;
        }

        .yellow {
            background: #c0a000;
            color: black;
        }

        .status-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;
        }

        .status-item {
            background: #292929;

            padding: 12px;

            border-radius: 8px;
        }

        .status-label {
            font-size: 13px;
            opacity: 0.6;
        }

        .status-value {
            font-size: 20px;
            font-weight: 600;

            margin-top: 4px;
        }

        #connectionStatus {
            font-weight: 600;
        }

        #log {
            background: #080808;

            border-radius: 8px;

            padding: 10px;

            height: 140px;

            overflow-y: auto;

            font-family: monospace;
            font-size: 12px;

            white-space: pre-wrap;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>YD ESP32</h1>

    <!-- Connection -->

    <div class="card">

        <div>
            Connection:
            <span id="connectionStatus">
                Disconnected
            </span>
        </div>

        <button
            id="connectButton"
            onclick="connectBluetooth()"
        >
            Connect
        </button>

        <button
            id="disconnectButton"
            onclick="disconnectBluetooth()"
            disabled
        >
            Disconnect
        </button>

    </div>


    <!-- Circuits -->

    <div class="card">

        <h2>Circuits</h2>

        <div class="circuit">

            <div>
                <div class="circuit-name">
                    🔴 Circuit 1
                </div>

                <div
                    class="circuit-state"
                    id="circuitState1"
                >
                    OFF
                </div>
            </div>

            <button
                id="circuitButton1"
                class="circuit-button off"
                onclick="toggleCircuit(0)"
                disabled
            >
                OFF
            </button>

        </div>


        <div class="circuit">

            <div>
                <div class="circuit-name">
                    🔵 Circuit 2
                </div>

                <div
                    class="circuit-state"
                    id="circuitState2"
                >
                    OFF
                </div>
            </div>

            <button
                id="circuitButton2"
                class="circuit-button off"
                onclick="toggleCircuit(1)"
                disabled
            >
                OFF
            </button>

        </div>


        <div class="circuit">

            <div>
                <div class="circuit-name">
                    🟢 Circuit 3
                </div>

                <div
                    class="circuit-state"
                    id="circuitState3"
                >
                    OFF
                </div>
            </div>

            <button
                id="circuitButton3"
                class="circuit-button off"
                onclick="toggleCircuit(2)"
                disabled
            >
                OFF
            </button>

        </div>


        <div class="circuit">

            <div>
                <div class="circuit-name">
                    🟡 Circuit 4
                </div>

                <div
                    class="circuit-state"
                    id="circuitState4"
                >
                    OFF
                </div>
            </div>

            <button
                id="circuitButton4"
                class="circuit-button off"
                onclick="toggleCircuit(3)"
                disabled
            >
                OFF
            </button>

        </div>

    </div>


    <!-- Battery -->

    <div class="card">

        <h2>Battery</h2>

        <div class="status-grid">

            <div class="status-item">

                <div class="status-label">
                    Voltage
                </div>

                <div
                    class="status-value"
                    id="batteryVoltage"
                >
                    --
                </div>

            </div>


            <div class="status-item">

                <div class="status-label">
                    Current
                </div>

                <div
                    class="status-value"
                    id="batteryCurrent"
                >
                    --
                </div>

            </div>


            <div class="status-item">

                <div class="status-label">
                    Power
                </div>

                <div
                    class="status-value"
                    id="batteryPower"
                >
                    --
                </div>

            </div>


            <div class="status-item">

                <div class="status-label">
                    SOC
                </div>

                <div
                    class="status-value"
                    id="batterySoc"
                >
                    --
                </div>

            </div>

        </div>

    </div>


    <!-- Circuit measurements -->

    <div class="card">

        <h2>Measurements</h2>

        <div class="status-grid">

            <div class="status-item">

                <div class="status-label">
                    Circuit 1
                </div>

                <div
                    class="status-value"
                    id="circuitMeasurement1"
                >
                    --
                </div>

            </div>


            <div class="status-item">

                <div class="status-label">
                    Circuit 2
                </div>

                <div
                    class="status-value"
                    id="circuitMeasurement2"
                >
                    --
                </div>

            </div>


            <div class="status-item">

                <div class="status-label">
                    Circuit 3
                </div>

                <div
                    class="status-value"
                    id="circuitMeasurement3"
                >
                    --
                </div>

            </div>


            <div class="status-item">

                <div class="status-label">
                    Circuit 4
                </div>

                <div
                    class="status-value"
                    id="circuitMeasurement4"
                >
                    --
                </div>

            </div>

        </div>

    </div>


    <!-- Log -->

    <div class="card">

        <h2>Log</h2>

        <div id="log"></div>

    </div>

</div>


<script>

/* -------------------------------------------------------------------------- */
/* UUIDs                                                                      */
/* -------------------------------------------------------------------------- */

const SERVICE_UUID =
    "12345678-1234-5678-1234-56789abcdef0";

const RGB_CHARACTERISTIC_UUID =
    "12345678-1234-5678-1234-56789abcdef1";

const STATUS_CHARACTERISTIC_UUID =
    "12345678-1234-5678-1234-56789abcdef2";

const CONTROL_CHARACTERISTIC_UUID =
    "12345678-1234-5678-1234-56789abcdef3";


/* -------------------------------------------------------------------------- */
/* BLE objects                                                                */
/* -------------------------------------------------------------------------- */

let device = null;
let server = null;

let service = null;

let rgbCharacteristic = null;
let statusCharacteristic = null;
let controlCharacteristic = null;


/* -------------------------------------------------------------------------- */
/* Circuit state                                                              */
/* -------------------------------------------------------------------------- */

const circuitStates = [
    false,
    false,
    false,
    false
];


/* -------------------------------------------------------------------------- */
/* Logging                                                                    */
/* -------------------------------------------------------------------------- */

function log(message)
{
    const logElement =
        document.getElementById("log");

    const time =
        new Date().toLocaleTimeString();

    logElement.textContent +=
        `[${time}] ${message}\n`;

    logElement.scrollTop =
        logElement.scrollHeight;
}


/* -------------------------------------------------------------------------- */
/* Connection status                                                          */
/* -------------------------------------------------------------------------- */

function setConnectionState(connected)
{
    const status =
        document.getElementById(
            "connectionStatus"
        );

    const connectButton =
        document.getElementById(
            "connectButton"
        );

    const disconnectButton =
        document.getElementById(
            "disconnectButton"
        );

    status.textContent =
        connected
            ? "Connected"
            : "Disconnected";

    connectButton.disabled =
        connected;

    disconnectButton.disabled =
        !connected;

    for (let i = 1; i <= 4; i++) {

        document.getElementById(
            `circuitButton${i}`
        ).disabled = !connected;
    }
}


/* -------------------------------------------------------------------------- */
/* Connect                                                                    */
/* -------------------------------------------------------------------------- */

async function connectBluetooth()
{
    try {

        log("Requesting YD_ESP32...");

        /*
         * This uses the exact device name.
         *
         * It does NOT show every Bluetooth device.
         */
        device =
            await navigator.bluetooth.requestDevice({
                filters: [
                    {
                        name: "YD_ESP32"
                    }
                ],

                optionalServices: [
                    SERVICE_UUID
                ]
            });

        log(
            `Selected device: ${device.name}`
        );


        device.addEventListener(
            "gattserverdisconnected",
            handleDisconnect
        );


        log("Connecting...");

        server =
            await device.gatt.connect();


        log("Connected to GATT server");


        service =
            await server.getPrimaryService(
                SERVICE_UUID
            );


        /* RGB */

        rgbCharacteristic =
            await service.getCharacteristic(
                RGB_CHARACTERISTIC_UUID
            );


        /* Circuit control */

        controlCharacteristic =
            await service.getCharacteristic(
                CONTROL_CHARACTERISTIC_UUID
            );


        /* Status */

        statusCharacteristic =
            await service.getCharacteristic(
                STATUS_CHARACTERISTIC_UUID
            );


        log(
            "All characteristics found"
        );


        /*
         * Start receiving the 36-byte status packets.
         */

        await statusCharacteristic.startNotifications();


        statusCharacteristic.addEventListener(
            "characteristicvaluechanged",
            handleStatusNotification
        );


        log(
            "Status notifications enabled"
        );


        setConnectionState(true);


        /*
         * Reset UI to OFF until the ESP reports
         * actual measurements.
         */

        updateCircuitButtons();

    }
    catch (error) {

        console.error(error);

        log(
            `Connection error: ${error.message}`
        );

        setConnectionState(false);
    }
}


/* -------------------------------------------------------------------------- */
/* Disconnect                                                                 */
/* -------------------------------------------------------------------------- */

async function disconnectBluetooth()
{
    try {

        if (
            device &&
            device.gatt &&
            device.gatt.connected
        ) {

            log("Disconnecting...");

            device.gatt.disconnect();
        }

    }
    catch (error) {

        console.error(error);

        log(
            `Disconnect error: ${error.message}`
        );
    }
}


/* -------------------------------------------------------------------------- */
/* BLE disconnected                                                           */
/* -------------------------------------------------------------------------- */

function handleDisconnect()
{
    log("BLE disconnected");

    setConnectionState(false);

    server = null;

    service = null;

    rgbCharacteristic = null;
    statusCharacteristic = null;
    controlCharacteristic = null;
}


/* -------------------------------------------------------------------------- */
/* Toggle circuit                                                             */
/* -------------------------------------------------------------------------- */

async function toggleCircuit(circuit)
{
    if (
        !controlCharacteristic
    ) {

        log(
            "Not connected"
        );

        return;
    }


    /*
     * Toggle the current state.
     */

    const newState =
        !circuitStates[circuit];


    /*
     * Protocol:
     *
     * byte 0 = circuit
     * byte 1 = state
     */

    const command =
        new Uint8Array([
            circuit,
            newState ? 1 : 0
        ]);


    try {

        log(
            `Circuit ${circuit + 1} -> ` +
            `${newState ? "ON" : "OFF"}`
        );


        await controlCharacteristic.writeValue(
            command
        );


        /*
         * Update local state immediately.
         *
         * The next status packet will provide
         * the measured current/power.
         */

        circuitStates[circuit] =
            newState;


        updateCircuitButtons();

    }
    catch (error) {

        console.error(error);

        log(
            `Circuit command failed: ` +
            `${error.message}`
        );
    }
}


/* -------------------------------------------------------------------------- */
/* Update circuit buttons                                                      */
/* -------------------------------------------------------------------------- */

function updateCircuitButtons()
{
    const classes = [
        "red",
        "blue",
        "green",
        "yellow"
    ];


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const button =
            document.getElementById(
                `circuitButton${i + 1}`
            );

        const state =
            document.getElementById(
                `circuitState${i + 1}`
            );


        button.classList.remove(
            "off",
            "red",
            "blue",
            "green",
            "yellow"
        );


        if (circuitStates[i]) {

            button.classList.add(
                classes[i]
            );

            button.textContent =
                "ON";

            state.textContent =
                "ON";

        }
        else {

            button.classList.add(
                "off"
            );

            button.textContent =
                "OFF";

            state.textContent =
                "OFF";
        }
    }
}


/* -------------------------------------------------------------------------- */
/* Decode status notification                                                 */
/* -------------------------------------------------------------------------- */

function handleStatusNotification(event)
{
    const data =
        event.target.value;


    /*
     * We expect exactly 36 bytes.
     */

    if (data.byteLength !== 36) {

        log(
            `Invalid status packet: ` +
            `${data.byteLength} bytes`
        );

        return;
    }


    const view =
        new DataView(
            data.buffer,
            data.byteOffset,
            data.byteLength
        );


    /*
     * Header
     */

    const version =
        view.getUint8(0);

    const messageType =
        view.getUint8(1);


    if (version !== 1) {

        log(
            `Unsupported protocol version: ${version}`
        );

        return;
    }


    if (messageType !== 1) {

        log(
            `Unknown message type: ${messageType}`
        );

        return;
    }


    /* ---------------------------------------------------------------------- */
    /* Battery                                                                */
    /* ---------------------------------------------------------------------- */

    const batteryVoltage =
        view.getUint16(
            2,
            true
        ) / 100.0;


    const batteryCurrent =
        view.getInt16(
            4,
            true
        ) / 100.0;


    const batteryPower =
        view.getInt16(
            6,
            true
        ) / 10.0;


    const batterySoc =
        view.getUint16(
            8,
            true
        ) / 10.0;


    document.getElementById(
        "batteryVoltage"
    ).textContent =
        `${batteryVoltage.toFixed(2)} V`;


    document.getElementById(
        "batteryCurrent"
    ).textContent =
        `${batteryCurrent.toFixed(2)} A`;


    document.getElementById(
        "batteryPower"
    ).textContent =
        `${batteryPower.toFixed(1)} W`;


    document.getElementById(
        "batterySoc"
    ).textContent =
        `${batterySoc.toFixed(1)} %`;


    /* ---------------------------------------------------------------------- */
    /* Circuits                                                               */
    /* ---------------------------------------------------------------------- */

    const circuitOffsets = [
        10,
        16,
        22,
        28
    ];


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const offset =
            circuitOffsets[i];


        const voltage =
            view.getUint16(
                offset,
                true
            ) / 100.0;


        const current =
            view.getUint16(
                offset + 2,
                true
            ) / 100.0;


        const power =
            view.getUint16(
                offset + 4,
                true
            ) / 10.0;


        document.getElementById(
            `circuitMeasurement${i + 1}`
        ).textContent =
            `${voltage.toFixed(2)} V\n` +
            `${current.toFixed(2)} A\n` +
            `${power.toFixed(1)} W`;
    }


    /*
     * Log occasionally rather than every packet.
     */

    console.log(
        "Status:",
        {
            batteryVoltage,
            batteryCurrent,
            batteryPower,
            batterySoc
        }
    );
}


/* -------------------------------------------------------------------------- */
/* Browser compatibility                                                       */
/* -------------------------------------------------------------------------- */

if (!navigator.bluetooth) {

    log(
        "Web Bluetooth is not supported " +
        "by this browser."
    );

    document.getElementById(
        "connectButton"
    ).disabled = true;
}


/* -------------------------------------------------------------------------- */
/* Initial state                                                              */
/* -------------------------------------------------------------------------- */

setConnectionState(false);

updateCircuitButtons();

</script>

</body>
</html>
